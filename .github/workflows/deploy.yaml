name: Deploy
run-name: >
  ${{ github.workflow }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }} on ${{ inputs.environment }}
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        type: string
        required: true
      environment:
        description: "Target environment"
        type: choice
        required: true
        options: [ staging, production ]
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        type: string
        required: true
      environment:
        description: "Target environment"
        type: string
        required: true
jobs:
  deploy:
    name: Deploy
    runs-on: [ self-hosted, "spring-boot-maven-example-${{ inputs.environment }}" ]
    permissions:
      contents: read
      packages: read
    environment: ${{ inputs.environment }}
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        env:
          # Required variables
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          DEPLOYMENT_DIRECTORY: ${{ vars.DEPLOYMENT_DIRECTORY }}

          # Optional Variables
          COMPOSE_FILE: .github/deployment/docker-compose.${{ inputs.environment }}.yaml
          SERVICES: application
          TRIGGER_SHA: ${{ github.sha }}
          DEBUG: ${{ github.event_name == 'workflow_dispatch' }}

          # Environment variables
          ENV_APPLICATION_PORT: ${{ vars.ENV_APPLICATION_PORT }}
          ENV_APPLICATION_USER_ID: ${{ vars.ENV_APPLICATION_USER_ID }}
          ENV_APPLICATION_GROUP_ID: ${{ vars.ENV_APPLICATION_GROUP_ID }}
        run: .github/scripts/deploy.sh